<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - IFSP Agendamentos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>

        <!-- Mensagens flash ou de erro -->
        <p th:if="${mensagem}" th:text="${mensagem}" style="color:green; font-weight:bold;"></p>
        <p th:if="${erro}" th:text="${erro}" style="color:red; font-weight:bold;"></p>

        <form th:action="@{/login}" method="post">
            <label for="nome">Usuário:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>

            <button type="submit">Entrar</button>
            <p><a th:href="@{/recuperar-senha}">Esqueci minha senha</a></p>
        </form>

        <div class="extra-links">
            <p>Ainda não tem uma conta?</p>
            <a th:href="@{/cadastro}" class="cadastro-link">Cadastrar-se</a>
        </div>
    </div>
</body>
</html>
