<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ver Agendamentos - IFSP Itapetininga</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* Complemento visual apenas para esta página (sem tocar no header global) */
        main.ver-agendamentos {
            max-width: 1100px;
            margin: 36px auto;
            padding: 24px;
            background: rgba(255,255,255,0.98);
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            z-index: 1;
        }

        .table-wrap {
            overflow-x: auto;
            margin-top: 12px;
        }

        table.agendamentos {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            min-width: 900px; /* mantém colunas proporcionais; usa scroll horizontal em telas pequenas */
        }

        table.agendamentos thead th {
            background-color: #1b5e20;
            color: #fff;
            padding: 10px 12px;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        table.agendamentos td {
            padding: 10px 12px;
            border-bottom: 1px solid #e9f4ea;
            text-align: center;
        }

        table.agendamentos tbody tr:nth-child(odd) {
            background: #fbfffb;
        }

        table.agendamentos tbody tr:hover {
            background: #eefbea;
        }

        .acoes a {
            display: inline-block;
            padding: 6px 10px;
            margin: 0 4px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .acoes .editar {
            background: #81c784;
            color: #0b4f22;
        }

        .acoes .excluir {
            background: #ef5350;
            color: #fff;
        }

        .novo-btn {
            display: inline-block;
            margin-top: 18px;
            background: #1b5e20;
            color: #fff;
            padding: 10px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
        }

        .mensagem {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-weight: 600;
            text-align: center;
        }
        .mensagem.sucesso { background: #dff0d8; color: #2b6b2c; }
        .mensagem.erro    { background: #f8d7da; color: #7a1a1f; }

        @media (max-width: 760px) {
            table.agendamentos { min-width: 700px; font-size: 0.85rem; }
        }

        tr.hoje {
            background-color: #fff9c4; /* Amarelo claro */
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- usa o mesmo header padrão do projeto para evitar "bug" -->
    <header>
        <div class="logo-area">
            <img src="/images/ifsp-itapetininga.png" alt="Logo IFSP" class="logo-small">
            <h1 class="titulo-central">Agendamento IFSP Itapetininga</h1>
        </div>
        <nav class="menu">
            <a th:href="@{/principal}"><button>Início</button></a>
            <a th:href="@{/agendar}"><button>Agendar</button></a>
            <a th:href="@{/historico}"><button>Histórico</button></a>
            <a th:href="@{/calendario}"><button>Calendário</button></a>
            <a th:href="@{/logout}"><button>Sair</button></a>
        </nav>

        
    </header>

    <main class="ver-agendamentos-container">
        <h2>Lista de Agendamentos</h2>
    
        <div th:if="${mensagem}" class="mensagem sucesso" th:text="${mensagem}"></div>
        <div th:if="${erro}" class="mensagem erro" th:text="${erro}"></div>
    
        <div class="table-container">
            <table class="tabela-agendamentos">
                <thead>
                    <tr>
                        <th>Responsável</th>
                        <th>E-mail</th>
                        <th>Sala</th>
                        <th>Data</th>
                        <th>Início</th>
                        <th>Término</th>
                        <th>Descrição</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="agendamento : ${agendamentos}">
                        <td th:text="${agendamento.responsavel}">Responsável</td>
                        <td th:text="${agendamento.emailContato}">email@ifsp.edu.br</td>
                        <td th:text="${agendamento.sala}">LAB Maker</td>
                        <td th:text="${#temporals.format(agendamento.data,'dd/MM/yyyy')}">01/01/2025</td>
                        <td th:text="${agendamento.horaInicio}">08:00</td>
                        <td th:text="${agendamento.horaFim}">10:00</td>
                        <td th:text="${agendamento.descricao}">Descrição</td>
                        <td class="acoes">
                            <!-- Exibe "Editar" apenas se for o dono do agendamento OU admin -->
                            <a th:if="${usuarioLogado != null and (usuarioLogado.tipo == 'ADMIN' or agendamento.responsavel == usuarioLogado.nomeUsuario)}"
                               th:href="@{'/editar/' + ${agendamento.id}}"
                               class="btn-editar">✏️ Editar</a>
                        
                            <!-- Exibe "Excluir" apenas se for admin OU dono do agendamento -->
                            <a th:if="${usuarioLogado != null and (usuarioLogado.tipo == 'ADMIN' or agendamento.responsavel == usuarioLogado.nomeUsuario)}"
                               th:href="@{'/excluir/' + ${agendamento.id}}"
                               class="btn-excluir">🗑️ Excluir</a>
                        </td>

                        <tr th:each="agendamento : ${agendamentos}"
                            th:classappend="${agendamento.data == T(java.time.LocalDate).now()} ? 'hoje' : ''">

                        
                    </tr>
                    <tr th:if="${#lists.isEmpty(agendamentos)}">
                        <td colspan="8" style="text-align:center; color:#777; padding:20px;">Nenhum agendamento encontrado.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    
        <div class="acoes-gerais">
            <a th:href="@{/agendar}" class="btn-novo">+ Novo Agendamento</a>
        </div>
    </main>
    
</body>
</html>
