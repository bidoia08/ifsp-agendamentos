<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Histórico de Agendamentos - IFSP Itapetininga</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        main {
            max-width: 900px;
            margin: 40px auto;
            background: rgba(255,255,255,0.98);
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            padding: 20px;
        }

        h2 {
            color: #1b5e20;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #1b5e20;
            color: white;
        }

        tr:hover {
            background-color: #f1f8e9;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-area">
        <img src="/images/ifsp-itapetininga.png" alt="Logo IFSP" class="logo-small">
        <h1 class="titulo-central">Agendamento IFSP Itapetininga</h1>
    </div>
    <nav class="menu">
        <a th:href="@{/principal}"><button>Início</button></a>
        <a th:href="@{/agendar}"><button>Agendar</button></a>
        <a th:href="@{/ver-agendamentos}"><button>Agendamentos</button></a>
        <a th:href="@{/calendario}"><button>Calendário</button></a>
        <a th:href="@{/logout}"><button>Sair</button></a>
    </nav>
</header>

<main>
    <h2>Histórico de Agendamentos</h2>

    <div th:if="${#lists.isEmpty(historico)}" style="text-align:center; color:#555; margin-top:20px;">
        <p>📜 Nenhum agendamento anterior encontrado.</p>
    </div>

    <table th:if="${!#lists.isEmpty(historico)}">
        <thead>
            <tr>
                <th>Data</th>
                <th>Sala</th>
                <th>Hora Início</th>
                <th>Hora Fim</th>
                <th>Responsável</th>
                <th>Descrição</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="a : ${historico}">
                <td th:text="${a.data}"></td>
                <td th:text="${a.sala}"></td>
                <td th:text="${a.horaInicio}"></td>
                <td th:text="${a.horaFim}"></td>
                <td th:text="${a.responsavel}"></td>
                <td th:text="${a.descricao}"></td>
            </tr>
        </tbody>
    </table>
</main>

</body>
</html>
